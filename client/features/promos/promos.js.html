<script>
    // 13. LOGIKA MARKETING & PROMO (CRUD)
    function fetchPromos() {
        showLoading(true);
        google.script.run
            .withSuccessHandler(function(data) {
                showLoading(false);
                allPromos = data || [];
                renderPromoGrid(allPromos);
            })
            .withFailureHandler(function(err) { showLoading(false); alert("Gagal muat promo: " + err.message); })
            .getPromos();
    }

    function renderPromoGrid(data) {
        const cont = document.getElementById('listPromo'); if(!cont) return;
        if(data.length === 0) { cont.innerHTML = `<div class="text-center py-10 font-bold text-slate-400 text-sm">Belum ada promo.</div>`; return; }
        
        let html = '';
        for(let i=0; i<data.length; i++) {
            const p = data[i]; 
            const d = new Date(p.berlaku_hingga); const isExpired = d < new Date(new Date().setHours(0,0,0,0));
            const dateStr = isNaN(d) ? '-' : d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
            const isActive = p.status === 'Aktif' && !isExpired;
            const displayStatus = isExpired ? 'KEDALUWARSA' : p.status.toUpperCase();
            
            let nominalStr = p.tipe_diskon === 'Persen' ? `${p.nilai_diskon}%` : `Rp ${p.nilai_diskon.toLocaleString('id-ID')}`;
            let discountBg = isActive ? 'bg-gradient-to-br from-violet-500 to-purple-600 text-white' : 'bg-slate-200 text-slate-500';

            html += `
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all flex flex-col md:flex-row md:items-stretch overflow-hidden group ${isActive ? '' : 'opacity-60 grayscale-[40%]'}">
                    
                    <!-- KIRI: Discount Badge (Voucher Feel) -->
                    <div class="${discountBg} w-full md:w-36 flex-shrink-0 flex flex-col items-center justify-center p-4 md:p-5 relative">
                        <span class="text-2xl md:text-3xl font-black leading-none">${p.tipe_diskon === 'Persen' ? p.nilai_diskon + '%' : 'Rp'}</span>
                        ${p.tipe_diskon !== 'Persen' ? '<span class="text-sm md:text-base font-black leading-none mt-0.5">' + parseInt(p.nilai_diskon).toLocaleString('id-ID') + '</span>' : '<span class="text-[10px] font-bold uppercase tracking-widest mt-1 opacity-80">DISKON</span>'}
                        <!-- Decorative circles for voucher look -->
                        <div class="hidden md:block absolute -right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 bg-slate-50 rounded-full border border-slate-100"></div>
                    </div>

                    <!-- TENGAH + KANAN: Info & Aksi -->
                    <div class="flex-1 flex flex-col md:flex-row md:items-center justify-between gap-4 p-4 md:p-5 md:pl-6">
                        
                        <!-- Info Utama -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center flex-wrap gap-2 mb-1">
                                <h5 class="font-black text-slate-900 text-base md:text-lg tracking-widest uppercase font-mono">${escapeHTML(p.kode_promo)}</h5>
                                <span class="text-[9px] font-black px-2 py-0.5 rounded-full border ${isActive ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-red-100 text-red-600 border-red-200'}">${displayStatus}</span>
                            </div>
                            <div class="flex items-center gap-3 text-[10px] md:text-xs font-bold text-slate-500">
                                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-violet-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Min. Rp ${p.min_transaksi.toLocaleString('id-ID')}</span>
                                <span class="text-slate-300">•</span>
                                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-violet-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> s/d ${dateStr}</span>
                            </div>
                        </div>

                        <!-- Divider (Desktop) -->
                        <div class="w-px h-8 bg-slate-200 hidden md:block mx-1"></div>

                        <!-- Aksi -->
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <button onclick="editPromoUI('${escapeHTML(p.id)}')" class="text-slate-400 hover:text-amber-600 bg-slate-50 hover:bg-amber-50 p-2.5 rounded-lg transition-colors border border-slate-100 shadow-sm" title="Edit Promo"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            <button onclick="deletePromoUI('${escapeHTML(p.id)}')" class="text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 p-2.5 rounded-lg transition-colors border border-slate-100 shadow-sm" title="Hapus Promo"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                </div>`;
        }
        cont.innerHTML = html;
    }

    function editPromoUI(id) {
        const p = allPromos.find(x => x.id === id); if(!p) return;
        editingPromoId = id;
        document.getElementById('promoKode').value = p.kode_promo;
        document.getElementById('promoTipe').value = p.tipe_diskon;
        document.getElementById('promoNilai').value = p.nilai_diskon;
        document.getElementById('promoMin').value = p.min_transaksi;
        document.getElementById('promoTanggal').value = p.berlaku_hingga.split('T')[0];
        document.getElementById('promoStatus').value = p.status;
        
        document.getElementById('titlePromo').innerHTML = '<div class="w-2 h-6 bg-amber-500 rounded-full"></div> Edit Promo';
        document.getElementById('titlePromo').className = 'text-xl font-black mb-6 flex items-center gap-3 text-slate-900';
        const btn = document.getElementById('btnSavePromo');
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Update Promo';
        btn.className = 'flex-[2] bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-amber-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2';
        document.getElementById('btnCancelPromo').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEditPromo() {
        editingPromoId = null;
        document.getElementById('promoKode').value = ''; document.getElementById('promoNilai').value = ''; document.getElementById('promoMin').value = '';
        document.getElementById('promoTanggal').value = ''; document.getElementById('promoStatus').value = 'Aktif'; document.getElementById('promoTipe').value = 'Nominal';
        
        document.getElementById('titlePromo').innerHTML = '<div class="w-2 h-6 bg-violet-600 rounded-full"></div> Buat Promo';
        document.getElementById('titlePromo').className = 'text-xl font-black mb-6 flex items-center gap-3 text-slate-900';
        const btn = document.getElementById('btnSavePromo');
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg> Simpan Promo';
        btn.className = 'flex-[2] bg-violet-600 hover:bg-violet-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-violet-600/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2';
        document.getElementById('btnCancelPromo').classList.add('hidden');
    }

    function savePromo() {
        const k = document.getElementById('promoKode').value.trim(); const t = document.getElementById('promoTipe').value;
        const n = parseInt(document.getElementById('promoNilai').value) || 0; const m = parseInt(document.getElementById('promoMin').value) || 0;
        const tgl = document.getElementById('promoTanggal').value; const st = document.getElementById('promoStatus').value;
        
        if(!k || n <= 0 || !tgl) { showToast("Kode, Nilai, dan Tanggal wajib diisi!", "error"); return; }
        
        showLoading(true);
        if(editingPromoId) {
            google.script.run.withSuccessHandler(res => {
                showLoading(false); if(res.success) { showToast("Promo diperbarui!"); cancelEditPromo(); fetchPromos(); } else { showToast("Gagal update!", "error"); }
            }).updatePromo(editingPromoId, k, t, n, m, new Date(tgl).toISOString(), st);
        } else {
            google.script.run.withSuccessHandler(res => {
                showLoading(false); if(res.success) { showToast("Promo disimpan!"); cancelEditPromo(); fetchPromos(); }
            }).addPromo(k, t, n, m, new Date(tgl).toISOString(), st);
        }
    }
    
    function deletePromoUI(id) { showDeleteModal('promo', id, 'Hapus Promo?'); }
    function performDeletePromo(id) { 
        showLoading(true); 
        google.script.run
            .withSuccessHandler(function(res) { 
                showLoading(false); 
                if (res.success) { showToast("Promo dihapus!"); if (editingPromoId === id) cancelEditPromo(); fetchPromos(); } 
                else { showToast("Gagal menghapus!", "error"); } 
            })
            .withFailureHandler(function(err) { showLoading(false); alert("Gagal Hapus:\n" + err.message); })
            .deletePromo(id); 
    }

</script>
