<div id="section-promo" class="section section-animate hidden w-full max-w-7xl mx-auto">
    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
        <div class="w-full lg:w-1/3">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 sticky top-4">
                <h3 id="titlePromo" class="text-xl font-black mb-6 flex items-center gap-3 text-slate-900">
                    <div class="w-2 h-6 bg-violet-600 rounded-full"></div> Buat Promo
                </h3>
                <div class="space-y-5">
                    <div class="relative">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Kode Promo *</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg></div>
                            <input type="text" id="promoKode" placeholder="LEBARAN2026" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-black text-sm uppercase tracking-widest font-mono focus:bg-white focus:ring-2 focus:ring-violet-100 focus:border-violet-500 transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Tipe Diskon *</label>
                            <select id="promoTipe" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm status-select focus:bg-white focus:ring-2 focus:ring-violet-100 focus:border-violet-500 transition-all">
                                <option value="Nominal">Nominal (Rp)</option>
                                <option value="Persen">Persentase (%)</option>
                            </select>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Nilai Diskon *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                                <input type="number" id="promoNilai" placeholder="10000" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-violet-100 focus:border-violet-500 transition-all">
                            </div>
                        </div>
                    </div>

                    <div class="relative">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Minimal Belanja (Rp)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none font-black text-slate-400 text-xs">Rp</div>
                            <input type="number" id="promoMin" placeholder="0 jika tanpa minimal" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-violet-100 focus:border-violet-500 transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Berlaku Hingga *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>
                                <input type="date" id="promoTanggal" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-violet-100 focus:border-violet-500 transition-all">
                            </div>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Status</label>
                            <select id="promoStatus" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm status-select focus:bg-white focus:ring-2 focus:ring-violet-100 focus:border-violet-500 transition-all">
                                <option value="Aktif">Aktif</option>
                                <option value="Nonaktif">Nonaktif</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-4 pt-6 border-t border-slate-100">
                        <button id="btnCancelPromo" onclick="cancelEditPromo()" class="hidden flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl transition-all active:scale-95 text-sm border border-slate-200">Batal</button>
                        <button id="btnSavePromo" onclick="savePromo()" class="flex-[2] bg-violet-600 hover:bg-violet-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-violet-600/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg> Simpan Promo
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="w-full lg:w-2/3">
            <h3 class="text-xl font-black text-slate-900 mb-6 flex items-center gap-3">
                <div class="w-2 h-6 bg-violet-600 rounded-full"></div> Daftar Promo Tersedia
            </h3>
            <div id="listPromo" class="flex flex-col gap-3"></div>
        </div>
    </div>
</div>
