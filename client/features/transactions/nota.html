<div id="notaModal" class="fixed inset-0 bg-slate-900/60 z-[140] hidden items-center justify-center backdrop-blur-sm transition-all overflow-y-auto py-10">
    <div class="flex flex-col gap-4 w-full max-w-[320px] px-4" id="printArea">
        <div id="notaPaper" class="bg-white p-6 rounded-2xl shadow-2xl font-receipt text-xs text-slate-800 relative overflow-hidden border border-slate-200">
            <div class="text-center border-b-2 border-dashed border-slate-300 pb-4 mb-4">
                <h2 class="text-xl font-bold tracking-widest mb-1 font-sans" id="printNotaTitle">L-PREMIUM</h2>
                <p class="text-[10px] text-slate-500" id="printNotaSubtitle">Laundry Bersih & Wangi</p>
            </div>
            <div class="space-y-1 mb-4 text-[11px]">
                <div class="flex justify-between"><span>No:</span><span id="notaId" class="font-bold">-</span></div>
                <div class="flex justify-between"><span>Tgl:</span><span id="notaDate">-</span></div>
                <div class="flex justify-between"><span>Kasir:</span><span id="notaKasir">-</span></div>
                <div class="flex justify-between mt-2 border-t border-slate-100 pt-2"><span>Pelanggan:</span><span id="notaCust" class="font-bold text-sm">-</span></div>
            </div>
            <div class="border-t-2 border-b-2 border-dashed border-slate-300 py-3 mb-3 space-y-2" id="notaItemsList">
                <!-- Items will be populated here -->
            </div>
            <div class="space-y-1 mb-3 border-b-2 border-dashed border-slate-300 pb-3">
                <div class="flex justify-between items-center text-slate-500">
                    <span class="uppercase text-[10px]">Subtotal</span>
                    <span id="notaSubtotal" class="font-bold">Rp 0</span>
                </div>
                <div class="flex justify-between items-center text-emerald-600">
                    <span class="uppercase text-[10px]" id="notaPromoName">Diskon</span>
                    <span id="notaDiskon" class="font-bold">-Rp 0</span>
                </div>
            </div>
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold uppercase text-sm">TOTAL</span>
                <span id="notaTotal" class="text-lg font-bold">Rp 0</span>
            </div>
            <div id="notaDPContainer" class="hidden space-y-1 mb-2 border-t border-slate-100 pt-2">
                <div class="flex justify-between items-center text-slate-500">
                    <span class="uppercase text-[10px]">Dibayar (DP)</span>
                    <span id="notaDibayar" class="font-bold">Rp 0</span>
                </div>
                <div class="flex justify-between items-center text-red-500">
                    <span class="uppercase text-[10px] font-bold">Sisa Tagihan</span>
                    <span id="notaSisa" class="font-bold">Rp 0</span>
                </div>
            </div>
            <div class="flex justify-between items-center text-[10px] text-blue-600 font-bold mb-4 bg-blue-50 px-2 py-1 rounded">
                <span>Estimasi Selesai:</span>
                <span id="notaEstimasi">-</span>
            </div>
            <div id="notaCatatanWrap" class="hidden text-left bg-slate-50 px-3 py-2 rounded text-[10px] text-slate-700 mb-3 border border-slate-200">
                <span class="font-bold uppercase block mb-0.5 text-slate-500">Catatan:</span>
                <span id="notaCatatan" class="whitespace-pre-wrap">-</span>
            </div>
            <div class="text-center bg-slate-100 py-1.5 rounded text-[10px] font-bold mb-6 border border-slate-200 uppercase tracking-widest" id="notaStatusBayar">
                STATUS BAYAR
            </div>
            <div class="text-center text-[10px] text-slate-500 whitespace-pre-wrap" id="printNotaFooter">Terima kasih!</div>
            <div id="notaTatatertibWrap" class="hidden mt-4 border-t border-dashed border-slate-200 pt-4">
                <p class="text-center text-[9px] font-black text-slate-600 uppercase tracking-widest mb-2">Syarat &amp; Ketentuan</p>
                <div id="printNotaTatatertib" class="text-[9px] text-slate-500 leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>
        <div id="notaActions" class="flex flex-col gap-2">
            <button onclick="sendWAfromNewOrder()" id="btnSendWA" class="hidden bg-[#25D366] hover:bg-[#1da851] text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95 justify-center items-center gap-2">Kirim via WhatsApp</button>
            <div class="flex gap-2">
                <button onclick="printNota()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition-all active:scale-95">Print Thermal</button>
                <button onclick="closeNota()" class="flex-1 bg-white border border-slate-200 text-slate-600 font-bold py-3.5 rounded-xl hover:bg-slate-50 transition-all active:scale-95 shadow-sm">Selesai</button>
            </div>
        </div>
    </div>
</div>
