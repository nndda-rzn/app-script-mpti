<div id="section-history" class="section section-animate hidden w-full max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl md:text-2xl font-black text-slate-900 flex items-center gap-2 md:gap-3 whitespace-nowrap">
            <div class="w-1.5 md:w-2 h-6 md:h-8 bg-blue-600 rounded-full"></div> Daftar Transaksi
        </h3>
        <div class="hidden sm:block bg-white px-4 py-2 rounded-xl border border-slate-200 text-[10px] font-black text-slate-500 shadow-sm uppercase tracking-widest whitespace-nowrap">
            Total Data: <span id="historyCount" class="text-blue-600 text-sm ml-1">0</span>
        </div>
    </div>

    <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
        <div class="flex flex-col xl:flex-row gap-3">
            <div class="flex-1 relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" id="searchHistory" oninput="debouncedFilterHistory()" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl outline-none text-sm font-semibold focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-700" placeholder="Cari nama pelanggan atau nota...">
            </div>
            
            <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto">
                <div class="flex items-center bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 flex-1 md:flex-none transition-all focus-within:bg-white focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500">
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mr-2 hidden sm:inline">PERIODE</span>
                    <input type="date" id="filterStartDate" onchange="filterHistory()" class="bg-transparent outline-none text-[11px] sm:text-xs font-bold text-slate-700 w-full sm:w-auto cursor-pointer">
                    <span class="text-slate-300 mx-1.5 sm:mx-2">-</span>
                    <input type="date" id="filterEndDate" onchange="filterHistory()" class="bg-transparent outline-none text-[11px] sm:text-xs font-bold text-slate-700 w-full sm:w-auto cursor-pointer">
                    <button onclick="resetDateFilter()" class="ml-2 text-slate-400 hover:text-red-500 hover:bg-red-50 bg-white rounded-full p-1 shadow-sm border border-slate-200 transition-colors" title="Reset Tanggal">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <select id="filterStatus" onchange="filterHistory()" class="px-4 py-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl outline-none text-xs sm:text-sm font-bold text-slate-600 status-select flex-1 md:flex-none focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    <option value="Semua">Semua Status</option>
                    <option value="Proses">Sedang Proses</option>
                    <option value="Selesai">Selesai</option>
                    <option value="Diambil">Sudah Diambil</option>
                </select>
            </div>
        </div>
    </div>
    <div id="tableHistory" class="flex flex-col gap-3"></div>
</div>
