<div id="paymentModal" class="fixed inset-0 bg-slate-900/60 z-[160] hidden items-center justify-center backdrop-blur-sm transition-all p-4 overflow-y-auto">
    <div class="bg-white p-6 md:p-8 rounded-[2rem] shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300 my-auto" id="paymentModalContent">
        <h3 class="text-2xl font-black text-slate-900 mb-1 tracking-tight border-b border-slate-100 pb-4">Pelunasan Transaksi</h3>
        <div class="py-4 space-y-4">
            <div class="bg-blue-50 p-4 rounded-xl text-center">
                <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mb-1">Total Tagihan</p>
                <p class="text-3xl font-black text-slate-900" id="payModalTagihan">Rp 0</p>
            </div>
            
            <div>
                <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase mb-1.5 block">Metode Pembayaran</label>
                <select id="modalPayMethod" onchange="toggleModalPayView()" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm status-select">
                    <option value="Tunai">Tunai / Cash</option>
                    <option value="QRIS">Scan QRIS</option>
                    <option value="Transfer">Transfer Bank</option>
                </select>
            </div>

            <div id="modalViewTunai" class="space-y-4">
                <div>
                    <div id="modalDPSisaContainer" class="hidden mb-3 p-3 bg-red-50 border border-red-100 rounded-lg text-center">
                        <span class="block text-[10px] font-bold text-red-400 uppercase">Sisa Tagihan</span>
                        <span class="block text-xl font-black text-red-600" id="modalSisaTagihan">Rp 0</span>
                    </div>
                    <label class="text-[10px] font-bold text-slate-400 ml-1 uppercase mb-1.5 block">Uang Diterima (Rp)</label>
                    <input type="number" id="modalInputUang" oninput="calcModalKembalian()" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-black text-blue-600 text-lg" placeholder="0">
                    <div class="flex flex-wrap gap-1.5 mt-2">
                        <button type="button" onclick="setModalQuickAmount('pas')" class="flex-1 min-w-[60px] bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold py-2 rounded-lg transition-all active:scale-95 shadow-sm">Uang Pas</button>
                        <button type="button" onclick="setModalQuickAmount(50000)" class="flex-1 min-w-[60px] bg-white hover:bg-slate-50 text-slate-600 text-[10px] font-bold py-2 rounded-lg transition-all active:scale-95 border border-slate-200 shadow-sm">50rb</button>
                        <button type="button" onclick="setModalQuickAmount(100000)" class="flex-1 min-w-[60px] bg-white hover:bg-slate-50 text-slate-600 text-[10px] font-bold py-2 rounded-lg transition-all active:scale-95 border border-slate-200 shadow-sm">100rb</button>
                        <button type="button" onclick="setModalQuickAmount(200000)" class="flex-1 min-w-[60px] bg-white hover:bg-slate-50 text-slate-600 text-[10px] font-bold py-2 rounded-lg transition-all active:scale-95 border border-slate-200 shadow-sm">200rb</button>
                    </div>
                </div>
                <div class="flex justify-between items-center p-4 bg-slate-800 text-white rounded-xl">
                    <span class="text-xs font-bold text-slate-300">Kembalian</span>
                    <span class="text-xl font-black text-emerald-400" id="modalKembalian">Rp 0</span>
                </div>
            </div>
            <div id="modalViewQRIS" class="hidden space-y-4 text-center">
                <label class="flex items-center justify-center gap-3 bg-emerald-50 text-emerald-700 p-4 rounded-xl cursor-pointer hover:bg-emerald-100 transition-colors border border-emerald-200">
                    <input type="checkbox" id="modalCheckQRIS" class="w-5 h-5 accent-emerald-600">
                    <span class="text-sm font-bold">Bukti QRIS Dilihat & Valid</span>
                </label>
            </div>
            <div id="modalViewTransfer" class="hidden space-y-4">
                <div class="bg-slate-50 border border-slate-200 p-5 rounded-xl text-center">
                    <p class="text-sm font-bold text-slate-500 mb-1">Transfer Ke:</p>
                    <p class="text-xl font-black text-blue-600" id="modalBankName">-</p>
                    <p class="text-2xl font-black text-slate-800 my-2 tracking-wider" id="modalBankRek">-</p>
                    <p class="text-xs font-bold text-slate-500 uppercase">A.N: <span id="modalBankAN" class="text-slate-800">-</span></p>
                </div>
                <label class="flex items-center justify-center gap-3 bg-emerald-50 text-emerald-700 p-4 rounded-xl cursor-pointer hover:bg-emerald-100 transition-colors border border-emerald-200">
                    <input type="checkbox" id="modalCheckTransfer" class="w-5 h-5 accent-emerald-600">
                    <span class="text-sm font-bold">Bukti TF Dilihat & Valid</span>
                </label>
            </div>
        </div>
        <div class="flex gap-3 mt-2 border-t border-slate-100 pt-4">
            <button onclick="closePaymentModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl transition-all active:scale-95 text-sm">Batal</button>
            <button onclick="executePelunasan()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 text-sm">Lunasi & Ganti Status</button>
        </div>
    </div>
</div>
