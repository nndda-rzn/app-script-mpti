<div id="section-pelanggan" class="section section-animate hidden w-full max-w-7xl mx-auto">
    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
        <div class="w-full lg:w-1/3">
            <div id="formCustomerContainer" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 transition-all duration-300 sticky top-4">
                <h3 id="titleCustomer" class="text-xl font-black mb-6 flex items-center gap-3 text-slate-900">
                    <div class="w-2 h-6 bg-emerald-500 rounded-full"></div> Tambah Pelanggan
                </h3>
                <div class="space-y-5">
                    <div class="relative">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Nama Pelanggan *</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></div>
                            <input type="text" id="newCustName" placeholder="Contoh: Budi" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500 transition-all">
                        </div>
                    </div>
                    <div class="relative">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">No WhatsApp</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg></div>
                            <input type="number" id="newCustWA" placeholder="08123xxxx" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-emerald-100 focus:border-emerald-500 transition-all">
                        </div>
                    </div>
                    
                    <div class="flex gap-3 mt-4 pt-6 border-t border-slate-100">
                        <button id="btnCancelCust" onclick="cancelEditCustomer()" class="hidden flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl transition-all active:scale-95 text-sm border border-slate-200">Batal</button>
                        <button id="btnSaveCust" onclick="saveCustomer()" class="flex-[2] bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg> Simpan Data
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="w-full lg:w-2/3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h3 class="text-xl md:text-2xl font-black text-slate-900 flex items-center gap-2 md:gap-3 whitespace-nowrap">
                    <div class="w-1.5 md:w-2 h-6 md:h-8 bg-emerald-500 rounded-full"></div> Daftar Pelanggan
                </h3>
                <div class="w-full sm:w-64">
                    <input type="text" id="searchCustomerDB" oninput="debouncedFilterCustomer()" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl outline-none text-sm shadow-sm" placeholder="Cari nama / WA...">
                </div>
            </div>
            <div id="tableCustomers" class="flex flex-col gap-3"></div>
        </div>
    </div>
</div>
