<script>
    // 3. FUNGSI AUTOCOMPLETE PELANGGAN (Ini yang sebelumnya hilang)
    function handleCustomerAutocomplete() { 
        const val = document.getElementById('custName').value.toLowerCase(); const dd = document.getElementById('customerDropdown'); dd.innerHTML = ''; 
        if(val.length < 1) { dd.classList.add('hidden'); return; } 
        const matches = []; for(let i=0; i<allCustomers.length; i++){ if(allCustomers[i].nama.toLowerCase().includes(val)) matches.push(allCustomers[i]); } 
        if(matches.length === 0) { dd.classList.add('hidden'); return; } 
        let htmlString = '';
        for(let i=0; i<matches.length; i++){ 
            const c = matches[i]; const namaAman = escapeHTML(c.nama); const waAman = escapeHTML(c.whatsapp) || '';
            htmlString += `<div onclick="pilihPelanggan('${namaAman}', '${waAman}')" class="px-5 py-3.5 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0 transition-colors"><div class="font-bold text-slate-800 text-sm truncate">${namaAman}</div><div class="text-[10px] font-bold text-blue-500 mt-0.5">${waAman || '-'}</div></div>`; 
        } 
        dd.innerHTML = htmlString; dd.classList.remove('hidden'); 
    }

    function pilihPelanggan(nama, wa) { 
        document.getElementById('custName').value = nama; 
        document.getElementById('custWA').value = wa; 
        document.getElementById('customerDropdown').classList.add('hidden'); 
    }

    // Pendeklarasian Debounce (Harus diletakkan setelah fungsinya ada)
    const debouncedFilterCustomer = debounce(filterCustomerList, 300);
    const debouncedHandleAutocomplete = debounce(handleCustomerAutocomplete, 300);

    document.addEventListener('click', function(e) { 
        const dd = document.getElementById('customerDropdown'); 
        if(dd && !e.target.closest('#custName') && !e.target.closest('#customerDropdown')) { dd.classList.add('hidden'); } 
    });

    // 7. PELANGGAN
    function fetchCustomers() { 
        google.script.run
            .withSuccessHandler(function(data) { allCustomers = data || []; renderCustomerGrid(allCustomers); })
            .withFailureHandler(function(err) { alert("GAGAL MUAT PELANGGAN:\n" + err.message); })
            .getCustomers(); 
    }
    
    function renderCustomerGrid(data) {
        const cont = document.getElementById('tableCustomers'); if(!cont) return; 
        if(data.length === 0) { cont.innerHTML = `<div class="col-span-full text-center py-10 font-bold text-slate-400 text-sm">Belum ada data pelanggan.</div>`; return; }
        let htmlString = '';
        for(let i=0; i<data.length; i++) {
            const c = data[i]; const d = new Date(c.terakhir_order); const dateStr = isNaN(d) ? '-' : d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}); const safeWa = c.whatsapp || '';
            const namaAman = escapeHTML(c.nama); const waAman = escapeHTML(safeWa);
            
            let totalTrx = 0; let totalSpent = 0;
            if (typeof allTransactions !== 'undefined' && allTransactions.length > 0) {
                for(let j=0; j<allTransactions.length; j++) {
                    if(allTransactions[j].customer && allTransactions[j].customer.toLowerCase() === c.nama.toLowerCase()) {
                        totalTrx++;
                        if(allTransactions[j].status_pembayaran === 'Lunas') { totalSpent += parseInt(allTransactions[j].total || 0); }
                    }
                }
            }
            
            let badgeHtml = '';
            if (totalSpent >= 2000000) { badgeHtml = `<span class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-2 py-0.5 rounded border border-purple-500/30 text-[8px] font-black tracking-widest uppercase shadow-sm ml-2">VIP</span>`; } 
            else if (totalSpent >= 750000) { badgeHtml = `<span class="bg-gradient-to-r from-amber-300 to-orange-400 text-white px-2 py-0.5 rounded border border-orange-300/50 text-[8px] font-black tracking-widest uppercase shadow-sm ml-2">GOLD</span>`; } 
            else if (totalSpent >= 250000) { badgeHtml = `<span class="bg-gradient-to-r from-slate-200 to-slate-300 text-slate-700 px-2 py-0.5 rounded border border-slate-300/50 text-[8px] font-black tracking-widest uppercase shadow-sm ml-2">SILVER</span>`; } 
            else { badgeHtml = `<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[8px] font-bold tracking-widest uppercase ml-2">MEMBER</span>`; }

            // Ambil inisial
            const initial = namaAman.charAt(0).toUpperCase();

            htmlString += `
                <div class="bg-white p-4 md:p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4 group">
                    
                    <!-- KIRI: Avatar & Identitas -->
                    <div class="flex items-center gap-4 flex-1 min-w-0">
                        <!-- Avatar -->
                        <div class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-slate-100 text-slate-600 font-black flex items-center justify-center flex-shrink-0 text-sm md:text-base group-hover:bg-emerald-50 group-hover:text-emerald-600 transition-colors border border-slate-200/50">${initial}</div>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center flex-wrap gap-2 mb-0.5">
                                <h5 class="font-black text-slate-900 text-sm md:text-base leading-tight truncate">${namaAman}</h5>
                                ${badgeHtml}
                            </div>
                            <div class="flex items-center gap-2 text-[10px] md:text-xs font-bold text-slate-500">
                                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg> ${waAman || 'Tidak ada WA'}</span>
                                <span class="text-slate-300 hidden md:inline">•</span>
                                <span class="hidden md:inline">Terakhir: ${dateStr}</span>
                            </div>
                        </div>
                    </div>

                    <!-- KANAN: Statistik & Aksi -->
                    <div class="flex flex-wrap md:flex-nowrap items-center justify-between md:justify-end gap-4 w-full md:w-auto mt-2 md:mt-0 pt-3 md:pt-0 border-t md:border-t-0 border-slate-100">
                        
                        <div class="text-left md:text-right flex-shrink-0">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest hidden md:block mb-0.5">Total ${totalTrx}x Order</p>
                            <div class="flex flex-col md:block">
                                <span class="text-sm md:text-base font-black text-emerald-600 leading-none">Rp ${totalSpent.toLocaleString('id-ID')}</span>
                                <span class="text-[9px] font-bold text-slate-400 block md:hidden mt-0.5">${totalTrx}x Order &bull; Terakhir: ${dateStr}</span>
                            </div>
                        </div>

                        <!-- Divider (Desktop) -->
                        <div class="w-px h-8 bg-slate-200 hidden md:block mx-1"></div>

                        <!-- Actions -->
                        <div class="flex gap-1.5 flex-shrink-0">
                            <button onclick="editCustomer('${escapeHTML(c.id)}', '${namaAman}', '${waAman}')" class="text-slate-400 hover:text-amber-600 bg-slate-50 hover:bg-amber-50 p-2.5 rounded-lg transition-colors border border-slate-100 shadow-sm" title="Edit"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            <button onclick="deleteCustomerUI('${escapeHTML(c.id)}')" class="text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 p-2.5 rounded-lg transition-colors border border-slate-100 shadow-sm" title="Hapus"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                </div>`;
        }
        cont.innerHTML = htmlString;
    }

    function filterCustomerList() { const val = document.getElementById('searchCustomerDB').value.toLowerCase(); const filtered = []; for(let i=0; i<allCustomers.length; i++){ if(allCustomers[i].nama.toLowerCase().includes(val) || (allCustomers[i].whatsapp && String(allCustomers[i].whatsapp).includes(val))) filtered.push(allCustomers[i]); } renderCustomerGrid(filtered); }
    function editCustomer(id, nama, wa) { editingCustomerId = id; document.getElementById('newCustName').value = nama; document.getElementById('newCustWA').value = wa; document.getElementById('titleCustomer').innerHTML = '<div class="w-2 h-6 bg-amber-500 rounded-full"></div> Edit Pelanggan'; document.getElementById('titleCustomer').className = 'text-xl font-black mb-6 flex items-center gap-3 text-slate-900'; const btnSave = document.getElementById('btnSaveCust'); btnSave.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Update Data'; btnSave.className = 'flex-[2] bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-amber-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2'; document.getElementById('btnCancelCust').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function cancelEditCustomer() { editingCustomerId = null; document.getElementById('newCustName').value = ''; document.getElementById('newCustWA').value = ''; document.getElementById('titleCustomer').innerHTML = '<div class="w-2 h-6 bg-emerald-500 rounded-full"></div> Tambah Pelanggan'; document.getElementById('titleCustomer').className = 'text-xl font-black mb-6 flex items-center gap-3 text-slate-900'; const btnSave = document.getElementById('btnSaveCust'); btnSave.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg> Simpan Data'; btnSave.className = 'flex-[2] bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2'; document.getElementById('btnCancelCust').classList.add('hidden'); }
    
    function saveCustomer() { 
        const n = document.getElementById('newCustName').value.trim(); const w = document.getElementById('newCustWA').value.trim(); 
        if(!n) { showToast("Nama pelanggan wajib diisi!", "error"); return; } 
        showLoading(true); 
        if(editingCustomerId) { 
            google.script.run.withSuccessHandler((res) => { showLoading(false); if(res.success) { showToast("Data diperbarui!"); cancelEditCustomer(); fetchCustomers(); } else { showToast("Gagal mengupdate!", "error"); } }).withFailureHandler((err)=>{ showLoading(false); alert("Gagal Simpan Pelanggan:\n" + err.message); }).updateCustomerData(editingCustomerId, n, w); 
        } else { 
            google.script.run.withSuccessHandler((res) => { showLoading(false); if(res.success) { showToast("Pelanggan disimpan!"); cancelEditCustomer(); fetchCustomers(); } }).withFailureHandler((err)=>{ showLoading(false); alert("Gagal Simpan Pelanggan:\n" + err.message); }).addCustomerData(n, w); 
        } 
    }
    
    function deleteCustomerUI(id) { showDeleteModal('customer', id, 'Hapus Pelanggan?'); }
    function performDeleteCustomer(id) { 
        showLoading(true); 
        google.script.run.withSuccessHandler((res) => { showLoading(false); if(res.success) { showToast("Pelanggan dihapus!"); if(editingCustomerId === id) cancelEditCustomer(); fetchCustomers(); } else { showToast("Gagal menghapus!", "error"); } }).withFailureHandler((err)=>{ showLoading(false); alert("Gagal Hapus Pelanggan:\n" + err.message); }).deleteCustomerData(id); 
    }

</script>
