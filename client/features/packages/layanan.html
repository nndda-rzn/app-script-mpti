<div id="section-paket" class="section section-animate hidden w-full max-w-7xl mx-auto">
    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">
        <div class="w-full lg:w-1/3">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 sticky top-4" id="formPaketContainer">
                <h3 id="titleLayanan" class="text-xl font-black mb-6 flex items-center gap-3 text-slate-900">
                    <div class="w-2 h-6 bg-blue-600 rounded-full"></div> Tambah Layanan
                </h3>
                <div class="space-y-5">
                    <div class="relative">
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Nama Layanan *</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg></div>
                            <input type="text" id="newPaket" placeholder="Misal: Cuci Express" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Harga (Rp) *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none font-black text-slate-400 text-xs">Rp</div>
                                <input type="number" id="newHarga" placeholder="10000" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all" min="0">
                            </div>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Satuan *</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"></path></svg></div>
                                <input type="text" id="newSatuan" placeholder="Kg / Pcs" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Durasi (Hari)</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
                                <input type="number" id="newDurasi" placeholder="2" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all" min="0">
                            </div>
                        </div>
                        <div class="relative">
                            <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Kategori</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg></div>
                                <input type="text" id="newKategori" placeholder="Reguler / Express" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all">
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 ml-1 uppercase tracking-widest mb-1.5 block">Status Layanan</label>
                        <select id="newStatus" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none font-semibold text-sm status-select focus:bg-white focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all">
                            <option value="Aktif">Aktif — Tampil di form transaksi</option>
                            <option value="Nonaktif">Nonaktif — Tersembunyi dari transaksi</option>
                        </select>
                    </div>

                    <div class="flex gap-3 mt-4 pt-6 border-t border-slate-100">
                        <button id="btnCancelPaket" onclick="cancelEditPaket()" class="hidden flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl transition-all active:scale-95 text-sm border border-slate-200">Batal</button>
                        <button id="btnSavePaket" onclick="savePaket()" class="flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> Simpan Layanan
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="w-full lg:w-2/3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h3 class="text-xl font-black text-slate-900 flex items-center gap-3 whitespace-nowrap">
                    <div class="w-2 h-6 bg-blue-600 rounded-full"></div> Daftar Layanan
                </h3>
                <div class="w-full sm:w-64">
                    <input type="text" id="searchPaket" oninput="filterPaketList()" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl outline-none text-sm shadow-sm font-semibold" placeholder="Cari nama layanan...">
                </div>
            </div>
            <div class="inline-flex bg-slate-100 p-1 rounded-xl mb-6 shadow-inner border border-slate-200/60">
                <button onclick="setPaketFilter('Semua')" id="filter-paket-all" class="paket-filter-btn px-6 py-2 rounded-lg text-[10px] sm:text-xs font-bold uppercase transition-all bg-white text-blue-600 shadow-sm border border-slate-200/50">Semua</button>
                <button onclick="setPaketFilter('Aktif')" id="filter-paket-aktif" class="paket-filter-btn px-6 py-2 rounded-lg text-[10px] sm:text-xs font-bold uppercase transition-all text-slate-500 hover:text-slate-700">Aktif</button>
                <button onclick="setPaketFilter('Nonaktif')" id="filter-paket-nonaktif" class="paket-filter-btn px-6 py-2 rounded-lg text-[10px] sm:text-xs font-bold uppercase transition-all text-slate-500 hover:text-slate-700">Nonaktif</button>
            </div>
            <div id="listPaket" class="flex flex-col gap-3 pb-6"></div>
        </div>
    </div>
</div>
