<script>
    // 12. PENGATURAN PAKET LAYANAN (CRUD)
    function fetchPaket() { 
        google.script.run
            .withSuccessHandler(function(data) { 
                allPackages = data || [];
                const sel = document.getElementById('selectPaket');
                if (!sel) return;
                // Hanya isi dropdown transaksi dengan layanan AKTIF
                let selHtml = '<option value="" disabled selected>-- Pilih Layanan --</option>';
                for (let i = 0; i < allPackages.length; i++) {
                    const p = allPackages[i];
                    if (p.status === 'Nonaktif') continue;
                    const safeSat = escapeHTML(p.satuan || 'Kg');
                    selHtml += `<option value="${escapeHTML(p.nama)}" data-harga="${p.harga}" data-satuan="${safeSat}" data-durasi="${escapeHTML(p.durasi || 0)}">${escapeHTML(p.nama)} (Rp ${parseInt(p.harga).toLocaleString('id-ID')} / ${safeSat})</option>`;
                }
                sel.innerHTML = selHtml;
                renderPaketGrid(allPackages);
            })
            .withFailureHandler(function(err) { alert("Gagal Muat Layanan:\n" + err.message); })
            .getPackages(); 
    }

    function renderPaketGrid(data) {
        const list = document.getElementById('listPaket'); if (!list) return;
        if (!data || data.length === 0) { list.innerHTML = '<div class="col-span-full text-center py-10 font-bold text-slate-400 text-sm">Belum ada layanan.</div>'; return; }
        
        // Hitung popularitas dari allTransactions
        const popCount = {};
        for (let i = 0; i < allTransactions.length; i++) {
            const t = allTransactions[i];
            if (t.items && t.items.length > 0) { t.items.forEach(function(it){ popCount[it.paket] = (popCount[it.paket] || 0) + 1; }); }
            else if (t.paket) { popCount[t.paket] = (popCount[t.paket] || 0) + 1; }
        }

        const katColors = ['bg-violet-100 text-violet-700','bg-amber-100 text-amber-700','bg-emerald-100 text-emerald-700','bg-sky-100 text-sky-700','bg-rose-100 text-rose-700'];
        const katMap = {}; let katIdx = 0;

        const icoEdit   = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>';
        const icoTrash  = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
        const icoClock  = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
        const icoTrend  = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>';
        const icoPause  = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
        const icoPlay   = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

        let html = '';
        for (let i = 0; i < data.length; i++) {
            const p = data[i];
            const isAktif = p.status !== 'Nonaktif';
            const safeSat = escapeHTML(p.satuan || 'Kg'); const namaAman = escapeHTML(p.nama);
            const pop = popCount[p.nama] || 0;
            const statusBadge = isAktif
                ? '<span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">AKTIF</span>'
                : '<span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 border border-slate-200">NONAKTIF</span>';
            let katBadge = '';
            if (p.kategori) {
                if (!katMap[p.kategori]) { katMap[p.kategori] = katColors[katIdx % katColors.length]; katIdx++; }
                katBadge = `<span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${katMap[p.kategori]} truncate max-w-[80px] block">${escapeHTML(p.kategori)}</span>`;
            }
            const toggleIcon  = isAktif ? icoPause : icoPlay;
            const toggleLabel = isAktif ? 'Nonaktifkan' : 'Aktifkan';
            const toggleClass = isAktif ? 'hover:bg-slate-100 text-slate-400 hover:text-slate-600' : 'hover:bg-emerald-50 text-emerald-400 hover:text-emerald-600';
            html += `
                <div class="bg-white p-4 md:p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4 group ${isAktif ? '' : 'opacity-60 grayscale-[50%]'}">
                    
                    <!-- KIRI: Avatar Kategori & Info Utama -->
                    <div class="flex items-center gap-4 flex-1 min-w-0">
                        <!-- Avatar Inisial Layanan -->
                        <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center flex-shrink-0 text-sm md:text-base font-black border border-slate-200/50 ${katMap[p.kategori] || 'bg-slate-100 text-slate-600'}">
                            ${namaAman.charAt(0).toUpperCase()}
                        </div>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center flex-wrap gap-2 mb-0.5">
                                <h5 class="font-black text-slate-900 text-sm md:text-base leading-tight truncate ${!isAktif ? 'line-through decoration-slate-400 decoration-2' : ''}">${namaAman}</h5>
                                ${statusBadge}
                                ${katBadge}
                            </div>
                            <div class="flex items-center gap-2 text-[10px] md:text-xs font-bold text-slate-500">
                                <span class="flex items-center gap-1"><svg class="w-3 h-3 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Durasi: ${escapeHTML(p.durasi || 0)} Hari</span>
                                <span class="text-slate-300 hidden md:inline">•</span>
                                <span class="flex items-center gap-1 ${pop > 0 ? 'text-blue-500 font-bold' : ''}"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg> ${pop} Pesanan</span>
                            </div>
                        </div>
                    </div>

                    <!-- KANAN: Harga, Toggle, Aksi -->
                    <div class="flex flex-wrap md:flex-nowrap items-center justify-between md:justify-end gap-4 md:gap-5 w-full md:w-auto mt-2 md:mt-0 pt-3 md:pt-0 border-t md:border-t-0 border-slate-100">
                        
                        <!-- Harga -->
                        <div class="text-left md:text-right flex-shrink-0">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest hidden md:block mb-0.5">Tarif per ${safeSat}</p>
                            <span class="text-lg md:text-xl font-black text-blue-600 leading-none">Rp ${parseInt(p.harga).toLocaleString('id-ID')}</span>
                        </div>

                        <!-- Divider -->
                        <div class="w-px h-8 bg-slate-200 hidden md:block mx-1"></div>

                        <!-- Actions -->
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <!-- Toggle iOS Style -->
                            <label class="relative inline-flex items-center cursor-pointer mr-2" title="${toggleLabel}">
                                <input type="checkbox" onchange="togglePaketStatus('${escapeHTML(p.id)}','${escapeHTML(p.status||'Aktif')}')" class="sr-only peer" ${isAktif ? 'checked' : ''}>
                                <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                            </label>

                            <button onclick="editPaket('${escapeHTML(p.id)}','${namaAman}','${p.harga}','${safeSat}','${escapeHTML(p.durasi||0)}','${escapeHTML(p.kategori||'')}','${escapeHTML(p.status||'Aktif')}')" class="text-slate-400 hover:text-amber-600 bg-slate-50 hover:bg-amber-50 p-2.5 rounded-lg transition-colors border border-slate-100 shadow-sm" title="Edit Layanan"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                            <button onclick="deletePaketUI('${escapeHTML(p.id)}')" class="text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 p-2.5 rounded-lg transition-colors border border-slate-100 shadow-sm" title="Hapus Layanan"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        </div>
                    </div>
                </div>`;
        }
        list.innerHTML = html;
    }

    function filterPaketList() {
        const q = (document.getElementById('searchPaket').value || '').toLowerCase();
        let filtered = allPackages.filter(function(p) {
            const matchName = p.nama.toLowerCase().includes(q) || (p.kategori || '').toLowerCase().includes(q);
            const matchStatus = currentPaketFilter === 'Semua' || p.status === currentPaketFilter || (currentPaketFilter === 'Aktif' && p.status !== 'Nonaktif');
            return matchName && matchStatus;
        });
        renderPaketGrid(filtered);
    }

    function setPaketFilter(f) {
        currentPaketFilter = f;
        document.querySelectorAll('.paket-filter-btn').forEach(function(b) {
            b.className = 'paket-filter-btn px-6 py-2 rounded-lg text-[10px] sm:text-xs font-bold uppercase transition-all text-slate-500 hover:text-slate-700';
        });
        const activeMap = { 'Semua': 'filter-paket-all', 'Aktif': 'filter-paket-aktif', 'Nonaktif': 'filter-paket-nonaktif' };
        if(activeMap[f]) {
            const el = document.getElementById(activeMap[f]);
            if(el) el.className = 'paket-filter-btn px-6 py-2 rounded-lg text-[10px] sm:text-xs font-bold uppercase transition-all bg-white text-blue-600 shadow-sm border border-slate-200/50';
        }
        filterPaketList();
    }

    function togglePaketStatus(id, currentStatus) {
        const newStatus = (currentStatus === 'Nonaktif') ? 'Aktif' : 'Nonaktif';
        showLoading(true);
        google.script.run
            .withSuccessHandler(function(res) {
                showLoading(false);
                if (res.success) { showToast('Status layanan diperbarui!'); fetchPaket(); }
                else { showToast('Gagal mengubah status.', 'error'); }
            })
            .withFailureHandler(function(err) { showLoading(false); alert('Gagal toggle status: ' + err.message); })
            .updatePackageStatus(id, newStatus);
    }

    function editPaket(id, nama, harga, satuan, durasi, kategori, status) {
        editingPaketId = id;
        document.getElementById('newPaket').value = nama;
        document.getElementById('newHarga').value = harga;
        document.getElementById('newSatuan').value = satuan;
        document.getElementById('newDurasi').value = durasi;
        document.getElementById('newKategori').value = kategori || '';
        document.getElementById('newStatus').value = status || 'Aktif';
        document.getElementById('titleLayanan').innerHTML = `<div class="w-2 h-6 bg-amber-500 rounded-full"></div> Edit Layanan`;
        document.getElementById('titleLayanan').className = 'text-xl font-black mb-6 flex items-center gap-3 text-slate-900';
        const btnSave = document.getElementById('btnSavePaket');
        btnSave.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Update Layanan';
        btnSave.className = 'flex-[2] bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-amber-500/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2';
        document.getElementById('btnCancelPaket').classList.remove('hidden');
    }
    function cancelEditPaket() {
        editingPaketId = null;
        document.getElementById('newPaket').value = '';
        document.getElementById('newHarga').value = '';
        document.getElementById('newSatuan').value = '';
        document.getElementById('newDurasi').value = '';
        document.getElementById('newKategori').value = '';
        document.getElementById('newStatus').value = 'Aktif';
        document.getElementById('titleLayanan').innerHTML = `<div class="w-2 h-6 bg-blue-600 rounded-full"></div> Tambah Layanan`;
        document.getElementById('titleLayanan').className = 'text-xl font-black mb-6 flex items-center gap-3 text-slate-900';
        const btnSave = document.getElementById('btnSavePaket');
        btnSave.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg> Simpan Layanan';
        btnSave.className = 'flex-[2] bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all active:scale-95 text-sm flex justify-center items-center gap-2';
        document.getElementById('btnCancelPaket').classList.add('hidden');
    }
    
    function savePaket() { 
        const n = document.getElementById('newPaket').value.trim();
        const h = document.getElementById('newHarga').value.trim();
        const s = document.getElementById('newSatuan').value.trim() || 'Kg';
        const d = document.getElementById('newDurasi').value.trim() || 0;
        const k = document.getElementById('newKategori').value.trim();
        const st = document.getElementById('newStatus').value || 'Aktif';
        if (!n || !h || h <= 0) { showToast('Nama & Harga wajib diisi!', 'error'); return; }
        showLoading(true);
        if (editingPaketId) {
            google.script.run
                .withSuccessHandler(function(res) {
                    showLoading(false);
                    if (res.success) { showToast('Layanan diperbarui!'); cancelEditPaket(); fetchPaket(); }
                    else { showToast('Gagal mengupdate!', 'error'); }
                })
                .withFailureHandler(function(err) { showLoading(false); alert('Gagal Simpan:\n' + err.message); })
                .updatePackage(editingPaketId, n, h, d, s, k, st);
        } else {
            google.script.run
                .withSuccessHandler(function(res) {
                    showLoading(false);
                    if (res.success) { showToast('Layanan disimpan!'); cancelEditPaket(); fetchPaket(); }
                    else { showToast('Gagal', 'error'); }
                })
                .withFailureHandler(function(err) { showLoading(false); alert('Gagal Simpan:\n' + err.message); })
                .addPackage(n, h, d, s, k, st);
        }
    }
    
    function deletePaketUI(id) { showDeleteModal('paket', id, 'Hapus Layanan?'); }
    function performDeletePaket(id) { 
        showLoading(true); 
        google.script.run
            .withSuccessHandler(function(res) { 
                showLoading(false); 
                if (res.success) { showToast("Layanan dihapus!"); if (editingPaketId === id) cancelEditPaket(); fetchPaket(); } 
                else { showToast("Gagal menghapus!", "error"); } 
            })
            .withFailureHandler(function(err) { showLoading(false); alert("Gagal Hapus:\n" + err.message); })
            .deletePackage(id); 
    }

</script>
