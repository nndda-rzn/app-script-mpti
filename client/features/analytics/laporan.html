<div id="section-laporan" class="section section-animate hidden w-full max-w-7xl mx-auto">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-5 mb-8">
        <h3 class="text-2xl font-black text-slate-900">Analisis Penjualan</h3>
        <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
            <div class="flex gap-1 bg-slate-50 border border-slate-200 p-1.5 rounded-2xl flex-1 md:flex-none overflow-x-auto">
                <button id="btn-filter-today" onclick="generateReport('today')" class="flex-1 md:flex-none px-4 py-2 hover:bg-white rounded-xl text-[10px] font-bold uppercase text-slate-500 transition-all">Harian</button>
                <button id="btn-filter-weekly" onclick="generateReport('weekly')" class="flex-1 md:flex-none px-4 py-2 hover:bg-white rounded-xl text-[10px] font-bold uppercase text-slate-500 transition-all">Mingguan</button>
                <button id="btn-filter-monthly" onclick="generateReport('monthly')" class="flex-1 md:flex-none px-4 py-2 hover:bg-white rounded-xl text-[10px] font-bold uppercase text-slate-500 transition-all">Bulanan</button>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToCSV()" class="bg-emerald-500 hover:bg-emerald-600 text-white p-2.5 rounded-xl shadow-md active:scale-95 transition-all text-xs font-bold">CSV</button>
                <button onclick="exportToPDF()" class="bg-red-500 hover:bg-red-600 text-white p-2.5 rounded-xl shadow-md active:scale-95 transition-all text-xs font-bold">PDF</button>
            </div>
        </div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 lg:col-span-2">
            <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6">
                <h4 class="font-black text-slate-800">Tren Pendapatan</h4>
                <div class="flex flex-col sm:flex-row items-center bg-slate-50 border border-slate-200 rounded-xl px-2 py-1 w-full xl:w-auto">
                    <div class="flex items-center w-full sm:w-auto">
                        <input type="date" id="reportStart" class="bg-transparent outline-none text-[11px] sm:text-xs font-bold text-slate-700 cursor-pointer w-full sm:w-auto">
                        <span class="text-slate-300 mx-2">-</span>
                        <input type="date" id="reportEnd" class="bg-transparent outline-none text-[11px] sm:text-xs font-bold text-slate-700 cursor-pointer w-full sm:w-auto">
                    </div>
                    <button onclick="generateReport('custom')" class="bg-blue-600 w-full sm:w-auto px-4 py-2 mt-2 sm:mt-0 text-white font-bold text-xs rounded-lg shadow-sm sm:ml-2 active:scale-95 transition-all">Terapkan Filter</button>
                </div>
            </div>
            <div class="chart-container h-[260px]"><div id="canvasTrend" class="w-full h-full"></div></div>
        </div>
        <div class="flex flex-col gap-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 flex-1">
                <h4 class="font-black text-slate-800 mb-6 text-center">Layanan Terlaris</h4>
                <div class="chart-container h-[240px]"><div id="canvasPackages" class="w-full h-full"></div></div>
            </div>
            <div class="bg-gradient-to-br from-blue-600 to-blue-700 p-8 rounded-[2rem] shadow-xl text-white text-center flex flex-col justify-center items-center">
                <p class="text-[10px] font-bold uppercase tracking-widest text-blue-200 mb-2">Total Pendapatan <span id="lblRentang" class="text-white bg-blue-500/50 px-1 rounded ml-1"></span></p>
                <h4 class="text-3xl font-black" id="avg-rev">Rp 0</h4>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
        <div class="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100">
            <h4 class="font-black text-slate-800 mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                Arus Kas (Metode Pembayaran)
            </h4>
            <div id="paymentSummary" class="space-y-3">
                <p class="text-sm text-slate-400 text-center py-4">Belum ada data.</p>
            </div>
        </div>
        <div class="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100">
            <h4 class="font-black text-slate-800 mb-5 flex items-center gap-2">
                <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                Top 5 Pelanggan Setia
            </h4>
            <div id="topCustomerSummary" class="space-y-2.5">
                <p class="text-sm text-slate-400 text-center py-4">Belum ada data.</p>
            </div>
        </div>
    </div>
</div>
