<div id="loginPage" class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-50 px-4 transition-all duration-500">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-20 h-20 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/30">
                <span class="text-white text-3xl font-black">LP</span>
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight mb-1">L-Premium</h1>
            <p class="text-sm text-slate-500 font-medium">Manajemen Laundry Cerdas</p>
        </div>
        <div class="bg-white p-8 rounded-[2rem] shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] border border-slate-100">
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Username</label>
                    <input type="text" id="username" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-semibold text-slate-800 text-sm" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider ml-1">Password</label>
                    <input type="password" id="password" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all font-semibold text-slate-800 text-sm" placeholder="••••••••">
                </div>
                <button id="loginBtn" onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-95 mt-2">Masuk ke Sistem</button>
                <p id="loginError" class="text-red-500 text-[11px] text-center font-bold hidden bg-red-50 py-2.5 rounded-lg"></p>
            </div>
        </div>
    </div>
</div>
